<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>บ้านเรา — รายจ่ายและงานบ้าน</title>
<meta name="theme-color" content="#B85C3E">
<meta name="description" content="จดรายจ่ายในบ้านและเช็คลิสต์งานบ้าน ใช้งานง่าย เก็บข้อมูลในเครื่อง">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="บ้านเรา">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --vh: 1vh;
    --bg: #FBF3E6;
    --paper: #FFFDF9;
    --ink: #3B2A1E;
    --ink-soft: #8C7462;
    --pine: #B85C3E;
    --pine-dark: #8C4128;
    --pine-light: #D48158;
    --brick: #7A4632;
    --gold: #D9A454;
    --gold-light: #EAC17E;
    --line: #F0DFC8;
    --danger: #B04A3C;
    --radius-card: 16px;
    --shadow-card: 0 2px 10px rgba(59,42,30,0.08);
    --shadow-lift: 0 8px 20px rgba(59,42,30,0.20);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans Thai","Kanit",sans-serif;
    font-size: 17.5px;
    line-height: 1.55;
    min-height: calc(var(--vh, 1vh) * 100);
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3, .num{ font-family:"Kanit","Noto Sans Thai",sans-serif; }

  /* ---------- Header ---------- */
  header.top{
    background: linear-gradient(155deg, var(--pine-light) 0%, var(--pine) 45%, var(--pine-dark) 100%);
    color: #F7F3EC;
    padding: calc(22px + env(safe-area-inset-top)) 20px 26px;
    border-radius: 0 0 26px 26px;
    box-shadow: 0 10px 24px rgba(36,68,58,0.22);
    position: relative;
    overflow: hidden;
  }
  header.top::after{
    content:"";
    position: absolute; right: -40px; top: -60px;
    width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 70%);
    pointer-events: none;
  }
  header.top .month-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 16px;
    position: relative; z-index: 1;
  }
  header.top .month-row button{
    background: rgba(255,255,255,0.14);
    border: none;
    color: #F7F3EC;
    width: 36px; height: 36px;
    border-radius: 11px;
    font-size: 19px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  header.top .month-row button:active{ background: rgba(255,255,255,0.26); }
  header.top .month-label{
    font-weight:600; font-size: 16px; letter-spacing: 0.02em;
    opacity: 0.92;
  }
  header.top .total-label{ font-size: 14px; opacity: 0.8; margin-bottom: 3px; position:relative; z-index:1;}
  header.top .total-amount{ font-size: 46px; font-weight: 700; position:relative; z-index:1; letter-spacing: -0.01em;}
  header.top .total-amount span{ font-size: 21px; font-weight: 500; opacity: 0.85; margin-left: 5px;}
  header.top .subrow{
    margin-top: 14px;
    display:flex; gap: 20px; font-size: 14px; opacity: 0.88;
    position: relative; z-index: 1;
  }

  /* ---------- Tabs ---------- */
  .view{ display:none; padding: 20px 16px 8px; max-width: 560px; margin: 0 auto;}
  .view.active{ display:block; }

  section.block{ margin-bottom: 24px; }
  section.block h2{
    font-size: 16px; font-weight: 600; color: var(--ink-soft);
    margin: 0 0 11px 3px;
  }

  /* ---------- Category bars ---------- */
  .cat-bars{
    display:flex; flex-direction:column; gap:13px;
    background: var(--paper); border-radius: var(--radius-card);
    padding: 16px 16px; box-shadow: var(--shadow-card);
  }
  .cat-bar-row{ display:flex; align-items:center; gap:10px; font-size: 14.5px;}
  .cat-bar-row .cat-name{ width: 82px; flex-shrink:0; color: var(--ink-soft);}
  .cat-bar-track{ flex:1; height: 9px; background: var(--line); border-radius: 5px; overflow:hidden;}
  .cat-bar-fill{ height:100%; border-radius: 5px; }
  .cat-bar-amt{ width: 68px; text-align:right; flex-shrink:0; font-variant-numeric: tabular-nums; font-weight: 600;}

  /* ---------- Receipt-style expense list ---------- */
  .receipt{
    background: var(--paper);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }
  .receipt-item{
    display:flex; align-items:center; gap: 13px;
    padding: 15px 16px;
    border-top: 1px dashed var(--line);
  }
  .receipt-item:first-child{ border-top: none; }
  .receipt-item .dot{
    width: 10px; height: 10px; border-radius: 50%; flex-shrink:0;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.03);
  }
  .receipt-item .info{ flex:1; min-width:0; }
  .receipt-item .info .cat{ font-size: 14px; color: var(--ink-soft); }
  .receipt-item .info .note{ font-size: 15.5px; margin-top: 2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .receipt-item .meta{ text-align:right; flex-shrink:0; }
  .receipt-item .amt{ font-variant-numeric: tabular-nums; font-weight:700; font-size: 16.5px;}
  .receipt-item .date{ font-size: 12px; color: var(--ink-soft); margin-top:2px;}
  .receipt-item .del{
    background:none; border:none; color: var(--ink-soft);
    font-size: 19px; padding: 5px 3px; cursor:pointer; line-height:1;
  }
  .empty{
    text-align:center; color: var(--ink-soft); font-size: 15px;
    padding: 30px 10px;
    background: var(--paper); border-radius: var(--radius-card); box-shadow: var(--shadow-card);
  }

  /* ---------- Chore checklist ---------- */
  .chore-list{ display:flex; flex-direction:column; gap:10px; }
  .chore-item{
    display:flex; align-items:center; gap: 13px;
    background: var(--paper);
    border-left: 5px solid var(--pine);
    border-radius: 13px;
    padding: 14px 14px;
    box-shadow: var(--shadow-card);
    transition: opacity 0.2s ease;
  }
  .chore-item.done{ border-left-color: var(--line); opacity: 0.6; box-shadow: none; }
  .chore-item .box{
    width: 27px; height: 27px; flex-shrink:0;
    border: 2.5px solid var(--pine);
    border-radius: 8px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color: var(--pine);
    font-size: 16px;
    font-weight: 700;
    transition: background 0.15s ease;
  }
  .chore-item.done .box{ background: var(--pine); color: #fff; }
  .chore-item .text{ flex:1; min-width:0; font-size: 16.5px; }
  .chore-item.done .text{ text-decoration: line-through; }
  .chore-item .tag{
    font-size: 12px; color: var(--ink-soft); margin-top: 2px;
  }
  .chore-item .del{
    background:none; border:none; color: var(--ink-soft);
    font-size: 19px; padding: 5px 3px; cursor:pointer; line-height:1;
  }

  /* ---------- Forms / FAB ---------- */
  .fab{
    position: fixed;
    right: 20px;
    bottom: calc(92px + env(safe-area-inset-bottom));
    width: 60px; height: 60px;
    border-radius: 50%;
    background: linear-gradient(155deg, var(--gold-light), var(--gold));
    color: #2A2420;
    border: none;
    font-size: 30px;
    box-shadow: var(--shadow-lift);
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    z-index: 30;
    transition: transform 0.12s ease;
  }
  .fab:active{ transform: scale(0.94); }

  .sheet-backdrop{
    position: fixed; inset:0; background: rgba(20,16,12,0.46);
    display:none; z-index: 40;
    align-items: flex-end;
    backdrop-filter: blur(1px);
  }
  .sheet-backdrop.open{ display:flex; }
  .sheet{
    background: var(--bg);
    width: 100%;
    border-radius: 24px 24px 0 0;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    max-width: 560px;
    margin: 0 auto;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.18);
  }
  .sheet h3{ margin: 2px 0 18px; font-size: 19.5px; }
  .field{ margin-bottom: 16px; }
  .field label{ display:block; font-size: 14px; color: var(--ink-soft); margin-bottom: 6px;}
  .field input, .field select, .field textarea{
    width:100%;
    font-family: inherit;
    font-size: 17px;
    padding: 12px 13px;
    border-radius: 11px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    color: var(--ink);
  }
  .field input:focus, .field select:focus{
    outline: none; border-color: var(--pine);
  }
  .field .chip-row{ display:flex; gap:9px; flex-wrap:wrap; }
  .field .chip{
    padding: 9px 15px; border-radius: 999px; border: 1.5px solid var(--line);
    background: var(--paper); font-size: 14.5px; cursor:pointer; color: var(--ink-soft);
    transition: all 0.12s ease;
  }
  .field .chip.sel{ background: var(--pine); border-color: var(--pine); color: #fff; font-weight: 600;}
  .sheet .row2{ display:flex; gap:10px; }
  .sheet .row2 .field{ flex:1; }
  .btn-primary{
    width:100%; padding: 15px; border-radius: 13px; border:none;
    background: var(--pine); color:#fff; font-size: 17px; font-weight:600;
    font-family: inherit; cursor:pointer; margin-top: 6px;
    box-shadow: 0 4px 14px rgba(59,93,80,0.3);
  }
  .btn-text{
    width:100%; text-align:center; background:none; border:none; color: var(--ink-soft);
    font-size: 15px; padding: 12px; cursor:pointer; font-family: inherit;
  }

  /* ---------- Bottom nav ---------- */
  nav.tabbar{
    position: fixed; left:0; right:0; bottom:0;
    background: var(--paper);
    border-top: 1px solid var(--line);
    display:flex;
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 20;
    box-shadow: 0 -2px 10px rgba(42,36,32,0.05);
  }
  nav.tabbar button{
    flex:1; background:none; border:none; padding: 13px 4px 11px;
    font-family: inherit; cursor:pointer; color: var(--ink-soft);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size: 13px;
  }
  nav.tabbar button .ic{ font-size: 23px; }
  nav.tabbar button.active{ color: var(--pine); font-weight: 600; }

  .toast{
    position: fixed; left:50%; transform: translateX(-50%);
    bottom: calc(98px + env(safe-area-inset-bottom));
    background: var(--ink); color: #fff; font-size: 14.5px;
    padding: 10px 18px; border-radius: 11px; opacity:0; pointer-events:none;
    transition: opacity 0.25s ease; z-index: 50;
    box-shadow: 0 6px 18px rgba(0,0,0,0.2);
  }
  .toast.show{ opacity: 0.96; }

  @media (min-width: 620px){
    header.top{ max-width: 560px; margin: 0 auto; border-radius: 26px; margin-top: 14px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="month-row">
    <button id="prevMonth" aria-label="เดือนก่อนหน้า">‹</button>
    <div class="month-label" id="monthLabel">–</div>
    <button id="nextMonth" aria-label="เดือนถัดไป">›</button>
  </div>
  <div class="total-label">รายจ่ายรวมเดือนนี้</div>
  <div class="total-amount"><span id="totalAmount">0</span><span>บาท</span></div>
  <div class="subrow">
    <div id="countLabel">0 รายการ</div>
    <div id="avgLabel">เฉลี่ยวันละ 0 บาท</div>
  </div>
</header>

<!-- ===================== EXPENSES VIEW ===================== -->
<div class="view active" id="view-expenses">
  <section class="block" id="catBlock" style="display:none;">
    <h2>แยกตามหมวด</h2>
    <div class="cat-bars" id="catBars"></div>
  </section>
  <section class="block">
    <h2>รายการล่าสุด</h2>
    <div class="receipt" id="expenseList"></div>
  </section>
</div>

<!-- ===================== CHORES VIEW ===================== -->
<div class="view" id="view-chores">
  <section class="block">
    <h2>ทำวันนี้</h2>
    <div class="chore-list" id="choreListToday"></div>
  </section>
  <section class="block" id="choreDoneBlock" style="display:none;">
    <h2>ทำแล้ว</h2>
    <div class="chore-list" id="choreListDone"></div>
  </section>
</div>

<button class="fab" id="fabAdd" aria-label="เพิ่มรายการ">+</button>

<!-- ===================== ADD EXPENSE SHEET ===================== -->
<div class="sheet-backdrop" id="expenseSheetBackdrop">
  <div class="sheet">
    <h3>เพิ่มรายจ่าย</h3>
    <div class="field">
      <label>จำนวนเงิน (บาท)</label>
      <input type="number" inputmode="decimal" id="expAmount" placeholder="0" min="0" step="0.01">
    </div>
    <div class="field">
      <label>หมวดหมู่</label>
      <div class="chip-row" id="expCatChips"></div>
    </div>
    <div class="row2">
      <div class="field">
        <label>วันที่</label>
        <input type="date" id="expDate">
      </div>
    </div>
    <div class="field">
      <label>โน้ต (ไม่บังคับ)</label>
      <input type="text" id="expNote" placeholder="เช่น ตลาดนัดเย็น">
    </div>
    <button class="btn-primary" id="saveExpense">บันทึกรายจ่าย</button>
    <button class="btn-text" id="cancelExpense">ยกเลิก</button>
  </div>
</div>

<!-- ===================== ADD CHORE SHEET ===================== -->
<div class="sheet-backdrop" id="choreSheetBackdrop">
  <div class="sheet">
    <h3>เพิ่มงานบ้าน</h3>
    <div class="field">
      <label>ชื่องาน</label>
      <input type="text" id="choreText" placeholder="เช่น ล้างจาน, ซักผ้า">
    </div>
    <div class="field">
      <label>ทำซ้ำ</label>
      <div class="chip-row">
        <div class="chip sel" data-repeat="none">ครั้งเดียว</div>
        <div class="chip" data-repeat="daily">ทุกวัน</div>
        <div class="chip" data-repeat="weekly">ทุกสัปดาห์</div>
      </div>
    </div>
    <button class="btn-primary" id="saveChore">เพิ่มงาน</button>
    <button class="btn-text" id="cancelChore">ยกเลิก</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<nav class="tabbar">
  <button class="tab-btn active" data-view="expenses">
    <span class="ic">🧾</span><span>รายจ่าย</span>
  </button>
  <button class="tab-btn" data-view="chores">
    <span class="ic">🧹</span><span>งานบ้าน</span>
  </button>
</nav>

<script>
(function(){
  "use strict";

  /* ---------- iOS Safari viewport fix ---------- */
  function setVH(){
    document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
  }
  setVH();
  window.addEventListener('resize', setVH);
  window.addEventListener('orientationchange', setVH);

  /* ---------- storage ---------- */
  const STORE_KEY = "baanrao_data_v1";
  function loadData(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { expenses: [], chores: [] };
  }
  function saveData(){
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }
  let data = loadData();

  const CATEGORIES = [
    {id:"food", label:"อาหาร", color:"#C89B3C"},
    {id:"water", label:"ค่าน้ำ", color:"#4C86A8"},
    {id:"electric", label:"ค่าไฟ", color:"#B08A2E"},
    {id:"stuff", label:"ของใช้", color:"#7A8C5E"},
    {id:"transport", label:"เดินทาง", color:"#A6533C"},
    {id:"other", label:"อื่นๆ", color:"#8A7E70"},
  ];
  function catInfo(id){ return CATEGORIES.find(c=>c.id===id) || CATEGORIES[CATEGORIES.length-1]; }

  /* ---------- toast ---------- */
  let toastTimer;
  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el.classList.remove('show'), 1800);
  }

  /* ---------- tabs ---------- */
  const tabBtns = document.querySelectorAll('.tab-btn');
  tabBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      tabBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      document.getElementById('view-' + btn.dataset.view).classList.add('active');
      fabAdd.dataset.mode = btn.dataset.view;
    });
  });

  /* ---------- month navigation ---------- */
  const monthNamesTH = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
  let viewDate = new Date();
  viewDate.setDate(1);

  document.getElementById('prevMonth').addEventListener('click', ()=>{
    viewDate.setMonth(viewDate.getMonth()-1);
    render();
  });
  document.getElementById('nextMonth').addEventListener('click', ()=>{
    viewDate.setMonth(viewDate.getMonth()+1);
    render();
  });

  function fmtNum(n){
    return n.toLocaleString('th-TH', {maximumFractionDigits: 2});
  }
  function monthKey(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0');
  }

  /* ---------- render expenses ---------- */
  function renderExpenses(){
    const label = monthNamesTH[viewDate.getMonth()] + " " + (viewDate.getFullYear()+543);
    document.getElementById('monthLabel').textContent = label;

    const mk = monthKey(viewDate);
    const monthExpenses = data.expenses
      .filter(e => e.date.slice(0,7) === mk)
      .sort((a,b)=> b.date.localeCompare(a.date) || b.id - a.id);

    const total = monthExpenses.reduce((s,e)=> s + e.amount, 0);
    document.getElementById('totalAmount').textContent = fmtNum(total);
    document.getElementById('countLabel').textContent = monthExpenses.length + " รายการ";

    const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 0).getDate();
    const today = new Date();
    const isCurrentMonth = today.getFullYear()===viewDate.getFullYear() && today.getMonth()===viewDate.getMonth();
    const divisor = isCurrentMonth ? today.getDate() : daysInMonth;
    const avg = monthExpenses.length ? total / divisor : 0;
    document.getElementById('avgLabel').textContent = "เฉลี่ยวันละ " + fmtNum(Math.round(avg)) + " บาท";

    // category bars
    const catBlock = document.getElementById('catBlock');
    const catBars = document.getElementById('catBars');
    catBars.innerHTML = "";
    if(monthExpenses.length){
      catBlock.style.display = "";
      const byCat = {};
      monthExpenses.forEach(e=>{ byCat[e.cat] = (byCat[e.cat]||0) + e.amount; });
      const maxVal = Math.max(...Object.values(byCat));
      Object.entries(byCat).sort((a,b)=>b[1]-a[1]).forEach(([catId, amt])=>{
        const info = catInfo(catId);
        const row = document.createElement('div');
        row.className = 'cat-bar-row';
        row.innerHTML = `
          <div class="cat-name">${info.label}</div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(amt/maxVal*100).toFixed(0)}%; background:${info.color}"></div></div>
          <div class="cat-bar-amt">${fmtNum(amt)}</div>
        `;
        catBars.appendChild(row);
      });
    } else {
      catBlock.style.display = "none";
    }

    // list
    const list = document.getElementById('expenseList');
    list.innerHTML = "";
    if(!monthExpenses.length){
      list.innerHTML = `<div class="empty">ยังไม่มีรายจ่ายเดือนนี้<br>แตะปุ่ม + เพื่อเริ่มบันทึก</div>`;
      return;
    }
    monthExpenses.forEach(e=>{
      const info = catInfo(e.cat);
      const d = new Date(e.date + "T00:00:00");
      const dateLabel = d.getDate() + " " + monthNamesTH[d.getMonth()].slice(0,3);
      const row = document.createElement('div');
      row.className = 'receipt-item';
      row.innerHTML = `
        <div class="dot" style="background:${info.color}"></div>
        <div class="info">
          <div class="cat">${info.label}</div>
          <div class="note">${e.note ? escapeHTML(e.note) : ''}</div>
        </div>
        <div class="meta">
          <div class="amt">${fmtNum(e.amount)}</div>
          <div class="date">${dateLabel}</div>
        </div>
        <button class="del" data-id="${e.id}" aria-label="ลบ">✕</button>
      `;
      row.querySelector('.del').addEventListener('click', ()=>{
        data.expenses = data.expenses.filter(x=>x.id !== e.id);
        saveData();
        renderExpenses();
        toast("ลบรายการแล้ว");
      });
      list.appendChild(row);
    });
  }

  function escapeHTML(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  /* ---------- render chores ---------- */
  function todayStr(){
    const t = new Date();
    return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,'0') + "-" + String(t.getDate()).padStart(2,'0');
  }
  function isoWeek(d){
    const date = new Date(d.getTime());
    date.setHours(0,0,0,0);
    date.setDate(date.getDate() + 3 - (date.getDay()+6)%7);
    const week1 = new Date(date.getFullYear(),0,4);
    return date.getFullYear()+"-W"+(1 + Math.round(((date - week1) / 86400000 - 3 + (week1.getDay()+6)%7)/7));
  }

  // reset recurring chores if their period has rolled over
  function refreshRecurring(){
    const tdy = todayStr();
    const wk = isoWeek(new Date());
    let changed = false;
    data.chores.forEach(c=>{
      if(c.repeat === 'daily' && c.lastReset !== tdy){
        c.done = false; c.lastReset = tdy; changed = true;
      } else if(c.repeat === 'weekly' && c.lastReset !== wk){
        c.done = false; c.lastReset = wk; changed = true;
      }
    });
    if(changed) saveData();
  }

  function renderChores(){
    refreshRecurring();
    const todayList = document.getElementById('choreListToday');
    const doneBlock = document.getElementById('choreDoneBlock');
    const doneList = document.getElementById('choreListDone');
    todayList.innerHTML = "";
    doneList.innerHTML = "";

    const pending = data.chores.filter(c=>!c.done);
    const done = data.chores.filter(c=>c.done);

    if(!data.chores.length){
      todayList.innerHTML = `<div class="empty">ยังไม่มีงานบ้าน<br>แตะปุ่ม + เพื่อเพิ่มงาน</div>`;
    } else if(!pending.length){
      todayList.innerHTML = `<div class="empty">ทำครบแล้ว เก่งมาก 🎉</div>`;
    } else {
      pending.forEach(c => todayList.appendChild(choreRow(c)));
    }

    if(done.length){
      doneBlock.style.display = "";
      done.forEach(c => doneList.appendChild(choreRow(c)));
    } else {
      doneBlock.style.display = "none";
    }
  }

  const repeatLabel = { daily: "ทำซ้ำทุกวัน", weekly: "ทำซ้ำทุกสัปดาห์", none: "" };

  function choreRow(c){
    const row = document.createElement('div');
    row.className = 'chore-item' + (c.done ? ' done' : '');
    row.innerHTML = `
      <div class="box" role="checkbox" aria-checked="${c.done}">${c.done ? '✓' : ''}</div>
      <div class="text">${escapeHTML(c.text)}${c.repeat && c.repeat!=='none' ? `<div class="tag">${repeatLabel[c.repeat]}</div>` : ''}</div>
      <button class="del" aria-label="ลบ">✕</button>
    `;
    row.querySelector('.box').addEventListener('click', ()=>{
      c.done = !c.done;
      saveData();
      renderChores();
    });
    row.querySelector('.del').addEventListener('click', ()=>{
      data.chores = data.chores.filter(x=>x.id !== c.id);
      saveData();
      renderChores();
      toast("ลบงานแล้ว");
    });
    return row;
  }

  function render(){
    renderExpenses();
    renderChores();
  }

  /* ---------- add expense sheet ---------- */
  const expenseSheetBackdrop = document.getElementById('expenseSheetBackdrop');
  const choreSheetBackdrop = document.getElementById('choreSheetBackdrop');
  const fabAdd = document.getElementById('fabAdd');
  fabAdd.dataset.mode = 'expenses';

  const expCatChips = document.getElementById('expCatChips');
  let selectedCat = CATEGORIES[0].id;
  CATEGORIES.forEach(c=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (c.id===selectedCat ? ' sel' : '');
    chip.textContent = c.label;
    chip.dataset.cat = c.id;
    chip.addEventListener('click', ()=>{
      selectedCat = c.id;
      expCatChips.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));
      chip.classList.add('sel');
    });
    expCatChips.appendChild(chip);
  });

  function openExpenseSheet(){
    document.getElementById('expAmount').value = '';
    document.getElementById('expNote').value = '';
    document.getElementById('expDate').value = todayStr();
    expenseSheetBackdrop.classList.add('open');
    setTimeout(()=> document.getElementById('expAmount').focus(), 50);
  }
  document.getElementById('cancelExpense').addEventListener('click', ()=> expenseSheetBackdrop.classList.remove('open'));
  expenseSheetBackdrop.addEventListener('click', (e)=>{ if(e.target === expenseSheetBackdrop) expenseSheetBackdrop.classList.remove('open'); });

  document.getElementById('saveExpense').addEventListener('click', ()=>{
    const amount = parseFloat(document.getElementById('expAmount').value);
    if(!amount || amount <= 0){ toast("กรอกจำนวนเงินก่อนนะ"); return; }
    const dateVal = document.getElementById('expDate').value || todayStr();
    const note = document.getElementById('expNote').value.trim();
    data.expenses.push({ id: Date.now(), amount, cat: selectedCat, date: dateVal, note });
    saveData();
    viewDate = new Date(dateVal + "T00:00:00");
    viewDate.setDate(1);
    expenseSheetBackdrop.classList.remove('open');
    renderExpenses();
    toast("บันทึกรายจ่ายแล้ว");
  });

  /* ---------- add chore sheet ---------- */
  let selectedRepeat = 'none';
  const repeatChips = choreSheetBackdrop.querySelectorAll('.chip[data-repeat]');
  repeatChips.forEach(chip=>{
    chip.addEventListener('click', ()=>{
      selectedRepeat = chip.dataset.repeat;
      repeatChips.forEach(c=>c.classList.remove('sel'));
      chip.classList.add('sel');
    });
  });

  function openChoreSheet(){
    document.getElementById('choreText').value = '';
    selectedRepeat = 'none';
    repeatChips.forEach(c=>c.classList.toggle('sel', c.dataset.repeat==='none'));
    choreSheetBackdrop.classList.add('open');
    setTimeout(()=> document.getElementById('choreText').focus(), 50);
  }
  document.getElementById('cancelChore').addEventListener('click', ()=> choreSheetBackdrop.classList.remove('open'));
  choreSheetBackdrop.addEventListener('click', (e)=>{ if(e.target === choreSheetBackdrop) choreSheetBackdrop.classList.remove('open'); });

  document.getElementById('saveChore').addEventListener('click', ()=>{
    const text = document.getElementById('choreText').value.trim();
    if(!text){ toast("กรอกชื่องานก่อนนะ"); return; }
    data.chores.push({
      id: Date.now(),
      text,
      done: false,
      repeat: selectedRepeat,
      lastReset: selectedRepeat === 'daily' ? todayStr() : (selectedRepeat === 'weekly' ? isoWeek(new Date()) : null)
    });
    saveData();
    choreSheetBackdrop.classList.remove('open');
    renderChores();
    toast("เพิ่มงานแล้ว");
  });

  fabAdd.addEventListener('click', ()=>{
    if(fabAdd.dataset.mode === 'chores') openChoreSheet();
    else openExpenseSheet();
  });

  /* ---------- service worker ---------- */
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }

  render();
})();
</script>
</body>
</html>
